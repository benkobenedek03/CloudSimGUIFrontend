<div class="flex gap-2 my-8 justify-center">
  <button class="btn btn-primary mx-12" (click)="ChangeView(ViewTypes.simple)">
    Simple config
  </button>

  <button class="btn btn-primary  mx-12" (click)="ChangeView(ViewTypes.detailed)">
    Detailed config
  </button>

  <button class="btn btn-primary  mx-12" (click)="ChangeView(ViewTypes.result)">
    Results
  </button>
</div>

@if (viewtype==ViewTypes.simple) {<app-simple-request (submitted)="SwitchToResults()"></app-simple-request>}
@if (viewtype==ViewTypes.detailed) {<app-detailed-request (submitted)="SwitchToResults()"/>}
@if (viewtype==ViewTypes.result) {<app-result></app-result>}
